# =============================================================================
# opa-ingress — exposes OPA so an EXTERNAL integration platform (MuleSoft) can
# query authorization decisions.
#
# ⚠️  SECURITY: OPA's REST API is powerful. The full API also allows WRITING data
# and policies (PUT /v1/policies, PUT/PATCH /v1/data, /v1/compile, /v1/query),
# so it must NOT be exposed wholesale. This ingress therefore publishes ONLY the
# decision surface — the `umzh.authz` package under /v1/data/umzh/authz — so the
# outside world can POST a decision query but cannot reach policy/data management
# or other packages.
#
# This is EDGE scoping, not authentication. OPA itself still trusts every caller
# that reaches it, and even under this prefix an HTTP verb other than POST could
# read/write base data at that path. So in front of this you MUST also:
#   • terminate at the WAF / MuleSoft with the platform authenticated (mTLS or a
#     gateway credential), and ideally restrict to POST; and/or
#   • enable OPA's own API authn/authz (`--authentication`, `--authorization`)
#     if OPA may be reached by anything but the trusted platform.
# Keep the base HAPI and the rest of OPA's API off the public internet.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opa-ingress
  labels:
    name: opa-ingress
  annotations:
    cert-manager.io/cluster-issuer: clusterissuer-acme-nginx
spec:
  ingressClassName: nginx
  rules:
    - host: opa.dev.umzhc.io.usz.ch
      http:
        paths:
          # Decision API only: POST /v1/data/umzh/authz/allow (core policy) or
          # /v1/data/umzh/authz/apisix (adapter entrypoint). Widen the prefix only
          # if MuleSoft genuinely needs more — never to bare /v1/data or /v1/.
          - pathType: Prefix
            path: '/v1/data/umzh/authz'
            backend:
              service:
                name: opa
                port:
                  number: 8181
  tls:
    - hosts:
        - opa.dev.umzhc.io.usz.ch
      secretName: opa.dev.umzhc.io.usz.ch-cert
