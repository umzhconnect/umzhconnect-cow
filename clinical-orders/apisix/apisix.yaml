# APISIX routes for the clinical-orders external gateway (standalone mode).
# Generated into the `apisix-external-config` ConfigMap by kustomize and mounted
# at /usr/local/apisix/conf/apisix.yaml. The ${{...}} references are resolved by
# APISIX at load time from the apisix-gateway-config env (AUTH_DISCOVERY_URL,
# OPA_URL, JWKS_UPSTREAM).
#
# This mirrors the sandbox's public external gateway
# (services/apisix/external/apisix.yaml): the SAME request filter injection
# (umzh-task-requester-inject) and the SAME security layers (openid-connect JWT →
# umzh-capability-guard → OPA umzh/authz/gateway). The routes follow the IG, not
# the sandbox. Two other things differ, both structural to the party deployment:
#
#   1. Upstream is the clinical-orders-fhir proxy, not the base HAPI. That proxy
#      maps /fhir/… → /fhir/clinical-orders/… and strips the partition from
#      response self-links. So — unlike the sandbox — these routes do NOT carry a
#      partition-adding proxy-rewrite; the proxy owns partition mapping.
#   2. The health path is /healthz (the Deployment readiness probe), where the
#      sandbox uses /__health. Same purpose.
routes:
  # ─── Health check — unauthenticated, for the readiness probe ─────────────
  - id: gw-health
    uri: /healthz
    methods: [GET]
    priority: 100
    plugins:
      serverless-pre-function:
        phase: access
        functions:
          - "return function() ngx.say('ok'); ngx.exit(200) end"

  # ─── Public JWKS endpoint — NO auth, NO OPA ──────────────────────────────
  # The external gateway is the party's public face: partner hospitals' IdPs hit
  # it to verify our private_key_jwt client assertions, so the JWK Set lives at
  # the same origin as the FHIR API (SMART Backend Services discovery shape).
  # JWKS_UPSTREAM is the party's key custodian / JWKS host:port; the gateway
  # container never mounts the keys itself.
  - id: ext-jwks
    uri: /jwks.json
    methods: [GET]
    priority: 100
    upstream:
      nodes:
        "${{JWKS_UPSTREAM}}": 1
      type: roundrobin

  # ─── Task list — JWT + scope (system/Task.s) + server-side requester filter ─
  # Scope-gated to require .s, and umzh-task-requester-inject sets
  # ?requester=<organization_reference> (an absolute Registry URL) from the
  # caller's token so HAPI only returns Tasks the caller requested; it overwrites
  # any caller-supplied requester, so the filter cannot be widened. No
  # proxy-rewrite here — the requester is a query arg (set via set_uri_args) and
  # the partition is added downstream by clinical-orders-fhir.
  - id: ext-task-list
    uri: /fhir/Task
    methods: [GET]
    priority: 10
    plugins:
      openid-connect:
        discovery: "${{AUTH_DISCOVERY_URL}}"
        bearer_only: true
        use_jwks: true
        set_access_token_header: false
        set_userinfo_header: false
        client_id: "unused"
        client_secret: "unused"
      umzh-capability-guard:
        allow_params: ["requester", "status", "_id", "_lastUpdated"]
        allow_includes:
          - "Task:output-value-reference"
          - "Task:output-value-canonical"
        allow_include_iterates:
          - "DiagnosticReport:result"
          - "MedicationStatement:medication"
          - "PractitionerRole:practitioner"
      opa:
        host: "${{OPA_URL}}"
        policy: "umzh/authz/gateway/decision"
      umzh-task-requester-inject: {}
    upstream:
      nodes:
        "clinical-orders-fhir:8080": 1
      type: roundrobin

  # ─── Task create — capability-guard (no params, forwards body) + OPA (Rule 1c) ─
  - id: ext-task-create
    uri: /fhir/Task
    methods: [POST]
    priority: 10
    plugins:
      openid-connect:
        discovery: "${{AUTH_DISCOVERY_URL}}"
        bearer_only: true
        use_jwks: true
        set_access_token_header: false
        set_userinfo_header: false
        client_id: "unused"
        client_secret: "unused"
      umzh-capability-guard:
        forward_body: true
      opa:
        host: "${{OPA_URL}}"
        policy: "umzh/authz/gateway/decision"
    upstream:
      nodes:
        "clinical-orders-fhir:8080": 1
      type: roundrobin

  # ─── Task update — capability-guard (no params, forwards body) + OPA (Rule 1d) ─
  - id: ext-task-update
    uri: /fhir/Task/*
    methods: [PUT]
    priority: 10
    plugins:
      openid-connect:
        discovery: "${{AUTH_DISCOVERY_URL}}"
        bearer_only: true
        use_jwks: true
        set_access_token_header: false
        set_userinfo_header: false
        client_id: "unused"
        client_secret: "unused"
      umzh-capability-guard:
        forward_body: true
      opa:
        host: "${{OPA_URL}}"
        policy: "umzh/authz/gateway/decision"
    upstream:
      nodes:
        "clinical-orders-fhir:8080": 1
      type: roundrobin

  # ─── FHIR read by ID — capability-guard (no params) + OPA consent gate ─
  # Matches /fhir/<type>/<id> (two path segments). One-segment paths are handled
  # by the search routes.
  - id: ext-fhir-read
    uri: /fhir/*
    methods: [GET]
    vars:
      - - "uri"
        - "~~"
        - "^/fhir/[^/]+/[^/]+$"
    priority: 5
    plugins:
      openid-connect:
        discovery: "${{AUTH_DISCOVERY_URL}}"
        bearer_only: true
        use_jwks: true
        set_access_token_header: false
        set_userinfo_header: false
        client_id: "unused"
        client_secret: "unused"
      umzh-capability-guard:
        allow_params: []
      opa:
        host: "${{OPA_URL}}"
        policy: "umzh/authz/gateway/decision"
    upstream:
      nodes:
        "clinical-orders-fhir:8080": 1
      type: roundrobin

  # ─── ServiceRequest search — capability-guard (_id required, enumerated
  #     includes) + OPA consent gate.
  - id: ext-sr-search
    uri: /fhir/ServiceRequest
    methods: [GET]
    priority: 10
    plugins:
      openid-connect:
        discovery: "${{AUTH_DISCOVERY_URL}}"
        bearer_only: true
        use_jwks: true
        set_access_token_header: false
        set_userinfo_header: false
        client_id: "unused"
        client_secret: "unused"
      umzh-capability-guard:
        require: ["_id"]
        allow_params: ["_id"]
        allow_includes:
          - "ServiceRequest:patient"
          - "ServiceRequest:subject"
          - "ServiceRequest:requester"
          - "ServiceRequest:reason-reference"
          - "ServiceRequest:supporting-info"
          - "ServiceRequest:insurance"
        allow_include_iterates:
          - "DiagnosticReport:result"
          - "MedicationStatement:medication"
          - "PractitionerRole:practitioner"
      opa:
        host: "${{OPA_URL}}"
        policy: "umzh/authz/gateway/decision"
    upstream:
      nodes:
        "clinical-orders-fhir:8080": 1
      type: roundrobin

  # ─── Questionnaire search — capability-guard + OPA (Rule 3) ─
  - id: ext-questionnaire-search
    uri: /fhir/Questionnaire
    methods: [GET]
    priority: 10
    plugins:
      openid-connect:
        discovery: "${{AUTH_DISCOVERY_URL}}"
        bearer_only: true
        use_jwks: true
        set_access_token_header: false
        set_userinfo_header: false
        client_id: "unused"
        client_secret: "unused"
      umzh-capability-guard:
        allow_params: ["_id", "url"]
      opa:
        host: "${{OPA_URL}}"
        policy: "umzh/authz/gateway/decision"
    upstream:
      nodes:
        "clinical-orders-fhir:8080": 1
      type: roundrobin

  # ─── Read-only types search — capability-guard (_id required, the IG's
  #     second-level includes; a value for another type has no effect) + OPA.
  - id: ext-readonly-search
    uris:
      - /fhir/AllergyIntolerance
      - /fhir/Appointment
      - /fhir/Condition
      - /fhir/Coverage
      - /fhir/DiagnosticReport
      - /fhir/DocumentReference
      - /fhir/ImagingStudy
      - /fhir/Immunization
      - /fhir/Medication
      - /fhir/MedicationStatement
      - /fhir/Observation
      - /fhir/Organization
      - /fhir/Patient
      - /fhir/Practitioner
      - /fhir/PractitionerRole
      - /fhir/Procedure
      - /fhir/QuestionnaireResponse
    methods: [GET]
    priority: 10
    plugins:
      openid-connect:
        discovery: "${{AUTH_DISCOVERY_URL}}"
        bearer_only: true
        use_jwks: true
        set_access_token_header: false
        set_userinfo_header: false
        client_id: "unused"
        client_secret: "unused"
      umzh-capability-guard:
        require: ["_id"]
        allow_params: ["_id"]
        allow_includes:
          - "DiagnosticReport:result"
          - "MedicationStatement:medication"
          - "PractitionerRole:practitioner"
      opa:
        host: "${{OPA_URL}}"
        policy: "umzh/authz/gateway/decision"
    upstream:
      nodes:
        "clinical-orders-fhir:8080": 1
      type: roundrobin

global_rules:
  - id: 1
    plugins:
      cors:
        allow_origins: "**"
        allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,Accept"
        expose_headers: "Content-Length,Content-Type,Location"
        max_age: 43200
        allow_credential: true
#END
