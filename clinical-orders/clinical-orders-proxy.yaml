# =============================================================================
# clinical-orders FHIR proxy — the outward-facing FHIR endpoint for this party.
# A thin rewrite in front of the partitioned base HAPI (namespace hapi-fhir):
# inbound partition-less /fhir/* is mapped onto the base's 'clinical-orders'
# partition, and the partition segment (and the base's internal host) are
# stripped back out — so the partition name never appears in an outward URL.
#
# The nginx config is the SHARED clinical-orders-proxy.conf.template (the same
# file docker compose uses), generated into a ConfigMap by kustomize and rendered
# at startup by the nginx image's envsubst from the PROXY_* env below.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinical-orders-fhir
  labels:
    app: clinical-orders-fhir
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clinical-orders-fhir
  template:
    metadata:
      labels:
        app: clinical-orders-fhir
    spec:
      # Satisfy the cluster's "restricted" Pod Security Standard. The
      # nginx-unprivileged image runs as non-root (UID 101) and listens on 8080.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: nginxinc/nginx-unprivileged:alpine
          env:
            # Host values (the k8s equivalents of the compose .env entries).
            - name: PROXY_UPSTREAM
              value: hapi-fhir.hapi-fhir.svc.cluster.local:8080
            - name: PROXY_OUTWARD_URL
              value: https://clinical-orders.dev.umzhc.io.usz.ch
            # Base URL HAPI advertises in self-links — MUST equal the base HAPI's
            # FHIR_SERVER_ADDRESS (hapi-fhir/hapi-fhir.yaml), which is set because
            # the base is also exposed directly via hapi-fhir-ingress.
            - name: PROXY_INTERNAL_BASE
              value: https://hapi-fhir.dev.umzhc.io.usz.ch/fhir
            # OPTIONAL: full Authorization header injected UPSTREAM to the backend
            # FHIR store (e.g. "Basic <base64(user:pass)>"). Empty = disabled
            # (default); the caller's Authorization then passes through unchanged.
            # Must stay DEFINED (empty is fine) so envsubst renders it. To enable
            # with a credential, replace this with a Secret reference — the value
            # is sensitive — and create the Secret:
            #   kubectl -n clinical-orders create secret generic clinical-orders-backend-auth \
            #     --from-literal=authorization='Basic <base64(user:pass)>'
            #   valueFrom: { secretKeyRef: { name: clinical-orders-backend-auth, key: authorization } }
            - name: PROXY_BACKEND_AUTHORIZATION
              value: ""
            # Only substitute PROXY_* so nginx's own $host/$1 are left intact.
            - name: NGINX_ENVSUBST_FILTER
              value: PROXY_
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: templates
              mountPath: /etc/nginx/templates
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: templates
          configMap:
            name: clinical-orders-proxy-tpl
---
apiVersion: v1
kind: Service
metadata:
  name: clinical-orders-fhir
  labels:
    app: clinical-orders-fhir
spec:
  selector:
    app: clinical-orders-fhir
  ports:
    - port: 8080
      targetPort: 8080
