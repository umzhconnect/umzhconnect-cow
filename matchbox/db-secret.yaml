# =============================================================================
# Matchbox database password — a PLAINTEXT Secret (stringData), committed for
# the dev cluster. Pairs with matchbox-db-config (db-config.yaml); injected via
# `envFrom` in matchbox.yaml and read by application.yaml as ${DB_PASSWORD}.
#
# For a real deployment do not commit the password: deliver this Secret as a
# SealedSecret (see key-custodian/SEALED-SECRETS.md) or create it out of band,
# and drop this file from kustomization.yaml.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: matchbox-db-secret
type: Opaque
stringData:
  DB_PASSWORD: 'umzhconnect'
