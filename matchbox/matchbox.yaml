# =============================================================================
# Matchbox — FHIR Mapping Language (StructureMap) transformation engine.
#
# Option D: the OFFICIAL matchbox image, unmodified. It fetches the IGs named in
# ig-validation.yaml (ch.fhir.ig.ch-etoc + its dependencies) from the FHIR package
# registry at first boot, THROUGH the corporate proxy (JAVA_TOOL_OPTIONS below),
# so it can $validate against the CH eToC profiles. application.yaml +
# ig-validation.yaml are generated by kustomize into `matchbox-config` and
# mounted at /config. No baked packages, no wrapper image.
# The StructureMaps are loaded by the load-maps sidecar (load-maps.sh, below).
#
# Storage: the managed (external) PostgreSQL, matchbox's own database
# (application.yaml datasource; connection in matchbox-db-config, password in
# matchbox-db-secret). It holds the installed IG packages, so the pod itself is
# stateless — no PVC. Maps loaded at runtime live in the engine's memory only;
# the load-maps sidecar reloads them after every matchbox (re)start.
#
# The referral-reception Kestra flow POSTs the placer Bundle to
#   http://matchbox:8080/matchboxv3/fhir/StructureMap/$transform?source=<map-url>
# and imports the returned CH eToC Bundle into the local store.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchbox
  labels:
    app: matchbox
spec:
  # Each pod has its own in-memory engine (onlyOneEngine), fed by its own
  # load-maps sidecar.
  replicas: 1
  strategy:
    # Never two pods at once: both would install the IG closure into the same
    # database on boot.
    type: Recreate
  selector:
    matchLabels:
      app: matchbox
  template:
    metadata:
      labels:
        app: matchbox
    spec:
      # "restricted" PSS. The official image runs as its own non-root 'matchbox'
      # user (uid/gid 1000), but declares it by NAME (USER matchbox), so the
      # kubelet can't verify runAsNonRoot unless the numeric UID is pinned here
      # (otherwise: CreateContainerConfigError).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # The USZ proxy inspects TLS (re-signs with "USZ Root CA 2"), so the JVM's
      # default truststore rejects packages.fhir.org (→ HAPI-1301 "Unable to locate
      # package"). Build a truststore = the image's default cacerts + the USZ root
      # CA into an emptyDir, using the image's own keytool (JAVA_HOME is
      # arch-specific, so don't hardcode the path). The main container points the
      # JVM at it via JAVA_TOOL_OPTIONS. CA rotation = update truststore/*.crt.
      initContainers:
        - name: truststore
          image: harbor-registry.io.usz.ch/prj-0011608-umzhc/matchbox:v4.1.21
          command:
            - sh
            - -c
            - >-
              cp "$JAVA_HOME/lib/security/cacerts" /truststore/cacerts &&
              chmod u+w /truststore/cacerts &&
              keytool -importcert -noprompt -alias usz-root-ca-2
              -file /ca/usz-root-ca.crt
              -keystore /truststore/cacerts -storepass changeit
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: ca
              mountPath: /ca
            - name: truststore
              mountPath: /truststore
      containers:
        - name: matchbox
          # Official matchbox, MIRRORED into your registry (matchbox is published
          # on Google Artifact Registry, not Docker Hub — mirror it as you do
          # other official images). Pin the version. The upstream tag is a
          # multi-arch index — mirror the linux/amd64 variant (or the whole index),
          # not an arm64 copy pulled on a Mac.
          image: harbor-registry.io.usz.ch/prj-0011608-umzhc/matchbox:v4.1.21
          # Re-declares the upstream entrypoint to also load ig-validation.yaml.
          # The image's JDK_JAVA_OPTIONS (since 4.1.18: 70% heap, exit on
          # OutOfMemoryError, string deduplication) still applies; the explicit
          # 75% heap below comes later on the command line and wins.
          command:
            - java
            - -XX:MaxRAMPercentage=75.0
            - -Dfhir.settings.path=/config/fhir-settings.json
            # k8s additionally loads ig-validation.yaml (the CH eToC IG load for
            # $validate) on top of the shared, transform-only application.yaml.
            - -Dspring.config.additional-location=optional:file:/config/application.yaml,optional:file:/config/ig-validation.yaml,optional:file:application.yaml
            - -jar
            - /matchbox.jar
          # DB_HOST/DB_PORT/DB_NAME/DB_USERNAME + DB_PASSWORD for the Postgres
          # datasource in application.yaml (required — no fallback).
          envFrom:
            - configMapRef:
                name: matchbox-db-config
            - secretRef:
                name: matchbox-db-secret
          # ── Proxy (Option D) ────────────────────────────────────────────────
          # matchbox fetches the IG packages at first boot through the corporate
          # proxy: packages.fhir.org / packages2.fhir.org (registry) and
          # packages.simplifier.net (where the CH tarballs are served) must be
          # allowed. The JVM honours ONLY the -D props (not HTTP_PROXY), so set
          # them here; internal hosts bypass via nonProxyHosts. The trustStore props
          # use the truststore built by the initContainer (USZ TLS inspection).
          # For direct egress (no proxy), drop the proxy props.
          env:
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Dhttps.proxyHost=proxy.usz.ch -Dhttps.proxyPort=8080
                -Dhttp.proxyHost=proxy.usz.ch -Dhttp.proxyPort=8080
                -Dhttp.nonProxyHosts=localhost|127.*|*.svc|*.cluster.local|*.usz.ch
                -Djavax.net.ssl.trustStore=/truststore/cacerts
                -Djavax.net.ssl.trustStorePassword=changeit
            # The image ships an OpenTelemetry exporter pointed at localhost:4318
            # (no collector here): it logs a "Failed to export spans" error every
            # few seconds and drops spans. Disable it.
            - name: OTEL_SDK_DISABLED
              value: 'true'
            - name: OTEL_TRACES_EXPORTER
              value: none
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: config
              mountPath: /config
            - name: truststore
              mountPath: /truststore
              readOnly: true
          # NOTE: /metadata answers as soon as the server is up — on the FIRST boot
          # matchbox then keeps installing the IG closure (11 packages, minutes)
          # in the background, so Ready != validation-ready. Watch the logs for
          # the PackageLoaderSvc lines to finish; the load-maps sidecar gates on
          # the ch-etoc profile instead. Later boots find the packages in Postgres
          # and are fast. The
          # startupProbe gives a slow (CPU-throttled) JVM start up to 15 min
          # before liveness applies.
          startupProbe:
            httpGet:
              path: /matchboxv3/fhir/metadata
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /matchboxv3/fhir/metadata
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              # Sized to fit the single USZ dev worker (~13.1Gi allocatable, ~4.7Gi
              # unrequested). Matchbox can burst to the 8Gi limit above this, but
              # under node memory pressure it is then an early OOM/eviction
              # candidate. Raise toward 6Gi once the worker has the headroom.
              cpu: 500m
              memory: 4Gi
            limits:
              # Matchbox is memory-heavy: the CH eToC IG + terminology closure is
              # ~290 MB of package JSON, and onlyOneEngine's engine reload (after
              # the map PUT) roughly doubles peak usage (the image even defaults
              # to -Xmx12g). 8Gi (→ ~6Gi heap at 75%) is the floor for THIS
              # closure — raise toward 12Gi if you see OOMKilled (exit 137).
              cpu: '2'
              memory: 8Gi
        # ── Map loader sidecar ────────────────────────────────────────────────
        # matchbox keeps runtime-loaded StructureMaps in memory only, so every
        # matchbox (re)start drops them. This sidecar runs load-maps.sh in watch
        # mode against its own pod (localhost): every 30s it PUTs a map again
        # when it is missing or its .fml changed (the matchbox-maps ConfigMap is
        # mounted as a directory, so updates arrive without a pod restart). It is
        # Ready only while every map is loaded, so the Service routes transforms
        # to this pod only once they would succeed.
        - name: load-maps
          image: curlimages/curl:8.21.0
          command: ['sh', '/maps/load-maps.sh']
          env:
            - name: MATCHBOX_URL
              value: http://localhost:8080/matchboxv3/fhir
            - name: MAPS_DIR
              value: /maps
            # Root profile of the IG in ig-validation.yaml — searchable once the
            # first-boot IG install has finished; no map PUT before that.
            - name: WAIT_FOR_PROFILE
              value: http://fhir.ch/ig/ch-etoc/StructureDefinition/ch-etoc-document
            - name: WATCH_INTERVAL
              value: '30'
            - name: STATE_DIR
              value: /tmp/load-maps
          readinessProbe:
            exec:
              command: ['sh', '-c', 'test -f /tmp/load-maps/ready']
            periodSeconds: 10
          # curlimages/curl runs as uid 100 by default; the pod-level runAsUser
          # (1000, for matchbox) applies here too, which is fine — the script
          # only writes to /tmp.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: maps
              mountPath: /maps
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: matchbox-config
        - name: ca
          configMap:
            name: matchbox-ca
        - name: maps
          configMap:
            name: matchbox-maps
        - name: truststore
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: matchbox
  labels:
    app: matchbox
spec:
  selector:
    app: matchbox
  ports:
    - port: 8080
      targetPort: 8080
