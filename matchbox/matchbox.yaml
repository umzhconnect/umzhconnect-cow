# =============================================================================
# Matchbox — FHIR Mapping Language (StructureMap) transformation engine.
#
# Option D: the OFFICIAL matchbox image, unmodified. It fetches the IGs named in
# ig-validation.yaml (ch.fhir.ig.ch-etoc + its dependencies) from the FHIR package
# registry at first boot, THROUGH the corporate proxy (JAVA_TOOL_OPTIONS below),
# so it can $validate against the CH eToC profiles. application.yaml +
# ig-validation.yaml are generated by kustomize into `matchbox-config` and mounted
# at /config. No baked packages, no wrapper image. The StructureMap is loaded by
# the matchbox-load-maps Job (load-maps.yaml).
#
# The referral-reception Kestra flow POSTs the placer Bundle to
#   http://matchbox:8080/matchboxv3/fhir/StructureMap/$transform?source=<map-url>
# and imports the returned CH eToC Bundle into the local store.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchbox
  labels:
    app: matchbox
spec:
  replicas: 1                     # file-based H2 is single-writer — never scale >1
  strategy:
    type: Recreate               # so the new pod can take the RWO /database volume
  selector:
    matchLabels:
      app: matchbox
  template:
    metadata:
      labels:
        app: matchbox
    spec:
      # "restricted" PSS. The official image runs as its own non-root 'matchbox'
      # user (uid/gid 1000), but declares it by NAME (USER matchbox), so the
      # kubelet can't verify runAsNonRoot unless the numeric UID is pinned here
      # (otherwise: CreateContainerConfigError). fsGroup 1000 makes the /database
      # PVC writable by that user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: matchbox
          # Official matchbox, MIRRORED into your registry (matchbox is published
          # on Google Artifact Registry, not Docker Hub — mirror it as you do
          # other official images). Pin the version. The upstream tag is a
          # multi-arch index — mirror the linux/amd64 variant (or the whole index),
          # not an arm64 copy pulled on a Mac.
          image: harbor-registry.io.usz.ch/prj-0011608-umzhc/matchbox:v4.1.14
          # Override the image entrypoint ONLY to replace its hard-coded -Xmx12g
          # with a container-aware heap (it would otherwise OOM a normal pod).
          # Everything else mirrors the upstream entrypoint.
          command:
            - java
            - -XX:MaxRAMPercentage=75.0
            - -Dfhir.settings.path=/config/fhir-settings.json
            # k8s additionally loads ig-validation.yaml (the CH eToC IG load for
            # $validate) on top of the shared, transform-only application.yaml.
            - -Dspring.config.additional-location=optional:file:/config/application.yaml,optional:file:/config/ig-validation.yaml,optional:file:application.yaml
            - -jar
            - /matchbox.jar
          # ── Proxy (Option D) ────────────────────────────────────────────────
          # matchbox fetches the IG packages at first boot through the corporate
          # proxy: packages.fhir.org / packages2.fhir.org (registry) and
          # packages.simplifier.net (where the CH tarballs are served) must be
          # allowed. The JVM honours ONLY the -D props (not HTTP_PROXY), so set
          # them here; internal hosts bypass via nonProxyHosts. For direct egress
          # (no proxy), remove this env block.
          env:
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Dhttps.proxyHost=proxy.usz.ch -Dhttps.proxyPort=8080
                -Dhttp.proxyHost=proxy.usz.ch -Dhttp.proxyPort=8080
                -Dhttp.nonProxyHosts=localhost|127.*|*.svc|*.cluster.local
            # The image ships an OpenTelemetry exporter pointed at localhost:4318
            # (no collector here): it logs a "Failed to export spans" error every
            # few seconds and drops spans. Disable it.
            - name: OTEL_SDK_DISABLED
              value: 'true'
            - name: OTEL_TRACES_EXPORTER
              value: none
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: config
              mountPath: /config
            # Embedded H2 lives here. Remove this mount (and the PVC below) to run
            # ephemeral — matchbox then re-fetches IGs (via the proxy) each boot.
            - name: database
              mountPath: /database
          # NOTE: /metadata answers as soon as the server is up — on the FIRST boot
          # matchbox then keeps installing the IG closure (11 packages, minutes)
          # in the background, so Ready != validation-ready. Watch the logs for
          # the PackageLoaderSvc lines to finish; the load-maps Job gates on the
          # ch-etoc profile instead. Later boots read the PVC and are fast. The
          # startupProbe gives a slow (CPU-throttled) JVM start up to 15 min
          # before liveness applies.
          startupProbe:
            httpGet:
              path: /matchboxv3/fhir/metadata
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /matchboxv3/fhir/metadata
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              # Request close to the steady-state footprint (heap up to 6Gi), so
              # the pod is scheduled on a node that can actually hold it and isn't
              # the first eviction candidate under node memory pressure.
              cpu: 500m
              memory: 6Gi
            limits:
              # Matchbox is memory-heavy: the CH eToC IG + terminology closure is
              # ~290 MB of package JSON, and onlyOneEngine's engine reload (after
              # the map PUT) roughly doubles peak usage (the image even defaults
              # to -Xmx12g). 8Gi (→ ~6Gi heap at 75%) is the floor for THIS
              # closure — raise toward 12Gi if you see OOMKilled (exit 137).
              cpu: '2'
              memory: 8Gi
      volumes:
        - name: config
          configMap:
            name: matchbox-config
        - name: database
          persistentVolumeClaim:
            claimName: matchbox-database
---
# Persists the embedded H2 DB (installed packages + the loaded StructureMap)
# across restarts/reschedules, so later boots skip the IG download. Delete this +
# the /database mount above to run fully ephemeral. RWO + a single replica: file
# H2 tolerates one writer only.
#
# Sizing: the CH eToC closure is ~290 MB unpacked; H2 stores each package's
# binary AND its indexed resources (+ search indexes), and H2 files grow without
# compacting when packages/maps are re-installed. 10Gi leaves ample headroom.
# Uses the cluster's default StorageClass. Growing an existing claim needs a
# StorageClass with allowVolumeExpansion; it can never be shrunk.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matchbox-database
  labels:
    app: matchbox
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: matchbox
  labels:
    app: matchbox
spec:
  selector:
    app: matchbox
  ports:
    - port: 8080
      targetPort: 8080
