namespace: matchbox

resources:
  - ns.yaml
  - db-config.yaml     # matchbox-db-config: Postgres host/port/db/user
  - db-secret.yaml     # matchbox-db-secret: DB_PASSWORD (plaintext, dev)
  - matchbox.yaml
  - ingress.yaml

# Matchbox's application.yaml is generated from the SHARED file colocated here
# (the same file docker compose bind-mounts), mirroring hapi-fhir/. ig-validation.yaml
# (CH eToC IG load) is k8s-only and layered on top by the Deployment command.
# The Postgres datasource in application.yaml reads its connection from the env
# set by db-config.yaml / db-secret.yaml.
configMapGenerator:
  - name: matchbox-config
    files:
      - application.yaml
      - ig-validation.yaml
  # USZ root CA (public cert, copied from umzhconnect-auth argocd truststore) —
  # the initContainer adds it to the JVM truststore for the TLS-inspecting proxy.
  - name: matchbox-ca
    files:
      - usz-root-ca.crt=truststore/usz-root-ca.crt
  # FHIR Mapping Language maps + the loader script run by the load-maps sidecar
  # (matchbox.yaml). Mounted as a directory, so map edits reach the running pod.
  - name: matchbox-maps
    files:
      - load-maps.sh
      - maps/ServiceRequestBundleToChEtoc.fml

generatorOptions:
  disableNameSuffixHash: true
